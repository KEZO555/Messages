# Builds the tool APK in CI, so a release doesn't need a local Android
# workspace. The build is a Gradle composite: `settings.gradle.kts` includes
# `../light-sdk`, so the two repositories are checked out as siblings and the
# SDK (chat service methods, the text-editor patches, the dev signing key)
# comes from fenleon's fork.
name: Build APK

# Pushing a v* tag also publishes the APK as a GitHub Release asset, which is
# what an installer like Obtainium tracks.
on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Publish a release from this run, creating this tag on the built
          commit (e.g. v0.10.1). Leave empty to just build the APK.
        required: false
        default: ''

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      # Needed only by the release step below; the branch builds don't write.
      contents: write
    steps:
      - name: Check out chats
        uses: actions/checkout@v4
        with:
          path: chats

      - name: Check out light-sdk
        uses: actions/checkout@v4
        with:
          repository: fenleon/light-sdk
          # Pinned so a change upstream can't silently break the build. Bump
          # this when the tool needs a newer SDK patch.
          ref: 07b23bb7a16cee60245a298963670ce6b466f4a0
          path: light-sdk

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"

      - name: Assemble debug
        working-directory: chats
        # The SDK fork pins toolchain paths from its author's machine; they are
        # absent here and the JDK above satisfies the 17 toolchain instead.
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Name the APK after the tool version
        id: apk
        working-directory: chats
        run: |
          version=$(sed -n 's/^versionName = "\(.*\)"$/\1/p' app/lighttool.toml)
          built=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          out="chats-devkeyboard-$version.apk"
          cp "$built" "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "path=chats/$out" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chats-devkeyboard-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # A v* tag publishes the APK as a release asset. One APK per release, so
      # Obtainium (or any installer that reads GitHub releases) has exactly one
      # thing to pick.
      # Either route works: push a v* tag, or run the workflow with a
      # release_tag input and gh creates that tag on the commit it just built
      # (the route for anyone without a git client to hand).
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        working-directory: chats
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Chats ${{ steps.apk.outputs.version }} — device keyboard" \
            --notes-file .github/release-notes.md \
            "${{ steps.apk.outputs.file }}"
